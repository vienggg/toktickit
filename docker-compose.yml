services:
  db:
    image: postgres:16-alpine
    container_name: toktickit-db
    environment:
      POSTGRES_USER: toktickit
      POSTGRES_PASSWORD: toktickit
      POSTGRES_DB: toktickit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toktickit -d toktickit"]
      interval: 3s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: toktickit-server
    environment:
      DATABASE_URL: "postgresql://toktickit:toktickit@db:5432/toktickit?schema=public"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: toktickit-client
    environment:
      VITE_API_URL: "http://server:3000"
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
